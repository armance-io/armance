# env_model_aliases.yaml — Armance model id → EcoLogits (provider, model) mapping.
#
# Covers Armance's four providers: openrouter, gemini, claude-code, custom-openai.
# OpenRouter uses "vendor/model" ids; Gemini uses bare model names.
# EcoLogits registry provider names: anthropic, openai, google_genai, mistralai,
# cohere, huggingface_hub.
#
# All target (ecologits_provider, ecologits_model) values verified against
# EcoLogits 0.10.1 registry. See service/footprint.py for the resolution chain.
#
# Format:
#   - armance_provider: <str>       # as passed by llm_service
#     armance_model:    <str>       # exact model id used by armance
#     ecologits_provider: <str>     # EcoLogits registry provider key
#     ecologits_model:    <str>     # EcoLogits registry model name

# ---------------------------------------------------------------------------
# OpenRouter — anthropic family
# ---------------------------------------------------------------------------
- armance_provider: openrouter
  armance_model: anthropic/claude-sonnet-4-6
  ecologits_provider: anthropic
  ecologits_model: claude-sonnet-4-6

- armance_provider: openrouter
  armance_model: anthropic/claude-opus-4-6
  ecologits_provider: anthropic
  ecologits_model: claude-opus-4-6

- armance_provider: openrouter
  armance_model: anthropic/claude-haiku-4-5
  ecologits_provider: anthropic
  ecologits_model: claude-haiku-4-5

- armance_provider: openrouter
  armance_model: anthropic/claude-opus-4-5
  ecologits_provider: anthropic
  ecologits_model: claude-opus-4-5

- armance_provider: openrouter
  armance_model: anthropic/claude-sonnet-4-5
  ecologits_provider: anthropic
  ecologits_model: claude-sonnet-4-5

- armance_provider: openrouter
  armance_model: anthropic/claude-3-haiku-20240307
  ecologits_provider: anthropic
  ecologits_model: claude-3-haiku-20240307

