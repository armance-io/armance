# Asistente `armance init` — RAG / embedding picker
# ---------------------------------------------------------------------------
init:
  rag:
    title: "Memoria de documentos (RAG)"
    intro: |2
        Armance puede indexar sus documentos (.armance/docs/) para búsqueda semántica.

        Cómo funciona:
        Un modelo de embedding convierte cada pasaje en una huella digital numérica.
        Cuando hace una pregunta, Armance encuentra los pasajes más relevantes.

        → Con embedding : búsqueda semántica precisa en sus documentos.
        → Sin embedding : documentos listados pero no buscados.
                          (se puede habilitar más tarde mediante config.yaml)
    querying: "Consultando las APIs para obtener los modelos de embedding disponibles..."
    found: "{count} modelo(s) encontrado(s)"
    none_found: "ninguno encontrado"
    skip_label: "ninguno"
    custom_sentinel: "[custom-openai]  ingresar manualmente →"
    custom_only_hint: |2
        custom-openai no expone una lista de modelos — ingrese el id del modelo a continuación.
        Deje en blanco para deshabilitar RAG.
    no_models_hint: |2
        Atención — No se encontró ningún modelo de embedding en sus proveedores (verifique sus claves API).
           Aún puede ingresar uno manualmente a continuación, o presione Enter para omitir RAG.
    prompt_provider: "Proveedor para este modelo de embedding:"
    prompt_manual_id: "Id del modelo de embedding (deje en blanco para deshabilitar RAG):"
    prompt_manual_id_custom: "Id del modelo de embedding para custom-openai:"
    prompt_autocomplete: "Modelo de embedding (autocompletar):"
    filter_hint: "Escriba para filtrar (por ejemplo, 'bge', 'openai'). Escriba 'ninguno' o deje en blanco para omitir RAG."
    disabled_short: "RAG deshabilitado."
    disabled_edit_yaml: "RAG deshabilitado. Edite .armance/config.yaml para habilitarlo más tarde."
    disabled_edit_keys: "RAG deshabilitado. Edite embedding_provider / embedding_model en .armance/config.yaml para habilitarlo más tarde."
    unrecognised: "Modelo '{name}' no reconocido. RAG deshabilitado."
    confirmed: "Embedding : [{provider}]  {model}"
  ssl_skip_prompt: "¿Omitir la verificación del certificado SSL? (necesario para certificados autofirmados / proxys corporativos MITM)"

