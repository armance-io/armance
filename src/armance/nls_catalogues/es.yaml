  part_deleted: "{n} eliminado(s) de la biblioteca"
  per_doc_line: "  • `{name}` → {chunks} fragmento(s)"
  success_suffix: "Todos los documentos son buscables por el equipo."
  failed: "error de indexación — {error}"
  embed_init_failed: "El cliente de embedding no pudo inicializarse — verifique `embedding_provider`, `embedding_model` y su clave API en `.armance/config.yaml` / `.env`. Los documentos están presentes en el disco pero la biblioteca RAG no se puede actualizar."
