  embedding_with_provider: "**Embedding**: `{provider}` / `{model}`"
  embedding_no_provider: "**Embedding**: {model}"
  embedding_none: "_(ninguno — solo búsqueda léxica)_"
  stats: "**Fragmentos**: {chunks} | **Tamaño**: {size_kb} KB | **Tokens (est.)**: ~{tokens}"
  no_docs_line: "_No hay documentos en `.armance/docs/`._"
  no_docs_hint: "> Coloque archivos PDF, MD, DOCX o TXT en `.armance/docs/` y pídale a Armance que los indexe."
  files_header: "### Archivos en `.armance/docs/`"
  status_stale: "🔄 modificado (necesita volver a indexarse)"
  status_retained: "indexado ({chunks} fragmentos, ~{tokens} tokens)"
  status_manifest_only: "Atención — en el manifiesto pero falta en la base de datos (¿error de ingestión?)"
  status_not_retained: "⏳ no indexado"
  doc_line: "- **{name}** ({size_kb} KB) — {status}"
  orphans_header: "### Huérfanos (en la biblioteca pero archivo eliminado de `.armance/docs/`)"
  orphan_line: "- **{name}** — {chunks} fragmentos para limpiar"
  orphans_hint: "> Estos documentos siguen siendo buscables pero sus archivos de origen ya no existen. Pídale a Armance que los olvide."

# ---------------------------------------------------------------------------
# Sección docs injectada en los system prompts
# ---------------------------------------------------------------------------
docs_section:
  title: "## Documentos en `.armance/docs/` (estado de la biblioteca)"
  empty_title: "## Documentos en `.armance/docs/`"
  empty_body: "_Ningún documento todavía._ Dígale al usuario que puede colocar archivos PDF / DOCX / MD / TXT en `.armance/docs/` y elegir cuáles **indexar** (biblioteca, buscable por fragmentos) y/o **cargar** (cada agente lee el texto completo)."
  empty_body_no_library: "_Ningún documento todavía._ Dígale al usuario que puede colocar archivos PDF / DOCX / MD / TXT en `.armance/docs/` y elegir cuáles **cargar** (cada agente lee el texto completo en esta sesión). La biblioteca buscable **no está configurada** en esta instalación (sin modelo de embedding), por lo que la indexación no está disponible. No proponga indexar. Si el usuario pregunta, mencione que puede habilitar la biblioteca volviendo a ejecutar `armance init` y eligiendo un modelo de embedding."
  status_retained: "indexado en la biblioteca (buscable por fragmentos)"
  status_unread: "⏳ aún no indexado (ofrecer indexar y/o cargar)"
  file_line: "- `{name}` — {status}"
  orphans_header: "### Huérfanos (aún en la biblioteca, archivo eliminado de `.armance/docs/`)"
  orphan_line: "- `{name}` — proponer olvidar mediante `[EXECUTE:/library-unindex:{name}]`"
  changes_header: "### Cambios desde la última sesión"
  change_added: "- ➕ nuevo: `{name}` — anúncielo y pregunte si se debe **indexar** (biblioteca), **cargar** (leído por cada agente) o ignorar"
  change_removed: "- ➖ desaparecido: `{name}` — pregunte al usuario si desea retirarlo de la biblioteca"
  rules: |2

    ## Reglas de manejo de documentos (CRÍTICO)
    - Vocabulario para el usuario: **'biblioteca'** (nunca 'base de datos' / 'RAG' / 'embeddings'), **'indexar'** o **'retener'** (colocar un doc en la biblioteca como **fragmentos**), **'cargar' / 'leer'** (llevar todo el texto a la memoria de trabajo del equipo).
    - Distinción a explicar claramente cuando hay varios docs pendientes:
      - **Indexar** un doc = sus fragmentos van al índice de la biblioteca; podemos recuperar pasajes mediante búsqueda, pero ningún agente lo ha leído.
      - **Cargar (leer)** un doc = asimilarlo; cada agente lo tiene presente para esta sesión. `--persist` lo mantiene cargado entre sesiones.
    - Si hay varios documentos pendientes, **lístelos uno por uno** y pregunte: ¿indexar? ¿cargar? ¿omitir? No los procese en lote en silencio.
    - Para **indexar** docs: emita `[EXECUTE:/library-index]` en su propia línea, después de la confirmación del usuario.
    - Para **cargar** un doc: emita `[EXECUTE:/library-load:<filename>]` en su propia línea.
    - Para **descargar** un doc: emita `[EXECUTE:/library-unload:<filename>]`.
    - Para **retirar** de la biblioteca: emita `[EXECUTE:/library-unindex:<filename>]`.
    - En el **primer mensaje** de una sesión: si aparece algún elemento `⏳`, `➕ nuevo` o `➖ desaparecido` arriba, anuncio y pregunte qué hacer ANTES de preguntar sobre el proyecto.

