# ---------------------------------------------------------------------------
# Sección docs injectada en los system prompts
# ---------------------------------------------------------------------------
docs_section:
  title: "## Dokumente in `.armance/docs/` (Bibliotheksstatus)"
  empty_title: "## Dokumente in `.armance/docs/`"
  empty_body: "_Noch keine Dokumente._ Sagen Sie dem Benutzer, dass er PDF- / DOCX- / MD- / TXT-Dateien in `.armance/docs/` ablegen und auswählen kann, welche **indexiert** (Bibliothek, nach Abschnitten durchsuchbar) und/oder **geladen** (jeder Agent liest den vollständigen Text) werden sollen."
  empty_body_no_library: "_Noch keine Dokumente._ Sagen Sie dem Benutzer, dass er PDF- / DOCX- / MD- / TXT-Dateien in `.armance/docs/` ablegen und auswählen kann, welche **geladen** werden sollen (jeder Agent liest den vollständigen Text in dieser Sitzung). Die durchsuchbare Bibliothek **ist auf dieser Installation nicht konfiguriert** (kein Embedding-Modell), daher ist die Indexierung nicht verfügbar. Schlagen Sie keine Indexierung vor. Wenn der Benutzer fragt, erwähnen Sie, dass er die Bibliothek aktivieren kann, indem er `armance init` erneut ausführt und ein Embedding-Modell auswählt."
  status_retained: "in der Bibliothek indexiert (nach Abschnitten durchsuchbar)"
  status_unread: "⏳ noch nicht indexiert (Indexierung und/oder Laden anbieten)"
  file_line: "- `{name}` — {status}"
  orphans_header: "### Verwaist (noch in der Bibliothek, Datei aus `.armance/docs/` entfernt)"
  orphan_line: "- `{name}` — vorschlagen, sie über `[EXECUTE:/library-unindex:{name}]` zu entfernen"
  changes_header: "### Änderungen seit der letzten Sitzung"
  change_added: "- ➕ neu: `{name}` — kündigen Sie es an und fragen Sie, ob es **indexiert** (Bibliothek), **geladen** (von jedem Agenten gelesen) oder ignoriert werden soll"
  change_removed: "- ➖ weg: `{name}` — fragen Sie den Benutzer, ob es aus der Bibliothek entfernt werden soll"
  rules: |2

    ## Regeln für den Umgang mit Dokumenten (KRITISCH)
    - Vokabular für den Benutzer: **'Bibliothek'** (niemals 'Datenbank' / 'RAG' / 'Embeddings'), **'indexieren'** oder **'aufnehmen'** (ein Dokument als **Abschnitte/Chunks** in die Bibliothek einfügen), **'laden' / 'lesen'** (den gesamten Text in den Arbeitsspeicher des Teams aufnehmen).
    - Klar zu erklärender Unterschied, wenn mehrere Dokumente ausstehen:
      - Ein Dokument **indexieren** = seine Abschnitte werden in den Bibliotheksindex aufgenommen; wir können Textstellen per Suche abrufen, aber kein Agent hat das Dokument gelesen.
      - Ein Dokument **laden (lesen)** = es aufnehmen; jeder Agent hat es für diese Sitzung im Kopf. `--persist` behält es über Sitzungen hinweg bei.
    - Wenn mehrere Dokumente ausstehen, **listen Sie diese einzeln auf** und fragen Sie: indexieren? laden? überspringen? Führen Sie keine stille Massenverarbeitung durch.
    - Zum **Indexieren** von Dokumenten: Geben Sie `[EXECUTE:/library-index]` auf einer eigenen Zeile aus, nach Bestätigung durch den Benutzer.
    - Zum **Laden** eines Dokuments: Geben Sie `[EXECUTE:/library-load:<filename>]` auf einer eigenen Zeile aus.
    - Zum **Entladen** eines Dokuments: Geben Sie `[EXECUTE:/library-unload:<filename>]` aus.
    - Zum **Entfernen** aus der Bibliothek: Geben Sie `[EXECUTE:/library-unindex:<filename>]` aus.
    - Bei der **ersten Nachricht** einer Sitzung: Wenn oben `⏳`, `➕ neu` oder `➖ weg` angezeigt werden, kündigen Sie diese an und fragen Sie, was zu tun ist, BEVOR Sie nach dem Projekt fragen.

