# ---------------------------------------------------------------------------
# Sección docs injectada en los system prompts
# ---------------------------------------------------------------------------
docs_section:
  title: "## `.armance/docs/` 中的文档（知识库状态）"
  empty_title: "## `.armance/docs/` 中的文档"
  empty_body: "_目前没有文档。_ 告知用户他们可以将 PDF / DOCX / MD / TXT 文件拖放到 `.armance/docs/` 中，并选择是**导入**（写入知识库，可分段搜索）和/或**加载**（每个代理都将阅读全文）。"
  empty_body_no_library: "_目前没有文档。_ 告知用户他们可以将 PDF / DOCX / MD / TXT 文件拖放到 `.armance/docs/` 中，并选择要**加载**哪些文件（每个代理都将在本会话中阅读全文）。此安装未配置可搜索知识库（无向量嵌入模型），因此导入不可用。请不要提议导入。如果用户询问，提到他们可以通过重新运行 `armance init` 并选择一个嵌入模型来启用知识库。"
  status_retained: "已导入到知识库中（可通过分段搜索）"
  status_unread: "⏳ 尚未导入（建议导入和/或加载）"
  file_line: "- `{name}` — {status}"
  orphans_header: "### 孤立文档（仍存在于知识库，但已从 `.armance/docs/` 中删除）"
  orphan_line: "- `{name}` — 提议通过 `[EXECUTE:/library-unindex:{name}]` 卸载"
  changes_header: "### 自上次会话以来的更改"
  change_added: "- ➕ 新增: `{name}` — 宣布此消息并询问是**导入**（知识库）、**加载**（由每个代理阅读）还是忽略"
  change_removed: "- ➖ 缺失: `{name}` — 询问用户是否将其从知识库中删除"
  rules: |2

    ## 文档处理规则 (至关重要)
    - 用户专用词汇: **'知识库'** (绝不要使用 '数据库' / 'RAG' / '向量嵌入')，**'导入'** (将文档作为**分段/片段**存入知识库)，**'加载' / '阅读'** (将全文读入团队的工作内存)。
    - 存在多个待处理文档时，需要向用户明确解释两者的区别:
      - **导入**一个文档 = 将其分段存入知识库索引；我们可以通过搜索检索段落，但代理并没有通读该文件。
      - **加载 (阅读)** 一个文档 = 让团队通读它；在当前会话中，每个代理都会将其牢记于心。使用 `--persist` 可以跨会话保持加载状态。
    - 如果有多个文档待处理，请**逐一列出**并询问: 导入？加载？跳过？绝不要在后台静默批量处理。
    - **导入**文档: 在获得用户确认后，在单独的一行中输出 `[EXECUTE:/library-index]`。
    - **加载**一个文档: 在单独的一行中输出 `[EXECUTE:/library-load:<filename>]`。
    - **卸载**一个文档: 输出 `[EXECUTE:/library-unload:<filename>]`。
    - 从知识库中**删除**: 输出 `[EXECUTE:/library-unindex:<filename>]`。
    - 在会话的**首条消息**中: 如果上方出现了 `⏳`、`➕ 新增` 或 `➖ 缺失` 项，请先宣布并询问如何处理，然后再询问项目相关问题。

