# ---------------------------------------------------------------------------
# Assistant `armance init` — sélection du modèle d'embedding (RAG)
# ---------------------------------------------------------------------------
init:
  rag:
    title: "Mémoire documentaire (RAG)"
    intro: |2
        Armance peut indexer vos documents (.armance/docs/) pour les retrouver
        intelligemment quand vous posez une question.

        Comment ça fonctionne :
        Un modèle d'« embedding » transforme chaque passage de vos documents
        en une empreinte numérique. Quand vous posez une question, Armance
        compare les empreintes pour retrouver les passages les plus pertinents.

        → Avec embedding : recherche sémantique précise dans vos docs.
        → Sans embedding  : les documents sont listés mais non recherchés.
                            (vous pourrez activer cela plus tard dans config.yaml)
    querying: "Interrogation des APIs pour lister les modèles disponibles…"
    found: "{count} modèle(s) trouvé(s)"
    none_found: "aucun modèle trouvé"
    skip_label: "aucun"
    custom_sentinel: "[custom-openai]  saisir manuellement →"
    custom_only_hint: |2
