# ---------------------------------------------------------------------------
# Docs section injected into agent system prompts
# ---------------------------------------------------------------------------
docs_section:
  title: "## Documents in `.armance/docs/` (library state)"
  empty_title: "## Documents in `.armance/docs/`"
  empty_body: "_No documents yet._ Tell the user they can drop PDF / DOCX / MD / TXT files into `.armance/docs/` and pick which to **index** (library, searchable by slip) and/or **load** (every agent reads the full text)."
  empty_body_no_library: "_No documents yet._ Tell the user they can drop PDF / DOCX / MD / TXT files into `.armance/docs/` and pick which to **load** (every agent reads the full text in this session). The searchable library is **not configured** on this install (no embedding model), so indexing is unavailable. Do not propose to index. If the user asks, mention they can enable the library by re-running `armance init` and choosing an embedding model."
  status_retained: "indexed in library (searchable by slip)"
  status_unread: "⏳ not yet indexed (offer to index and/or load)"
  file_line: "- `{name}` — {status}"
  orphans_header: "### Orphans (still in library, file removed from `.armance/docs/`)"
  orphan_line: "- `{name}` — propose to drop via `[EXECUTE:/library-unindex:{name}]`"
  changes_header: "### Changes since last session"
  change_added: "- ➕ new: `{name}` — announce it and ask whether to **index** (library), **load** (read by every agent), or ignore"
  change_removed: "- ➖ gone: `{name}` — ask the user whether to drop it from the library"
  rules: |2

    ## Document handling rules (CRITICAL)
    - Vocabulary for the user: **'library'** (never 'database' / 'RAG' / 'embeddings'), **'index'** (place a doc into the library as **slips/chunks**), **'load' / 'read'** (take the whole text into the team's working memory).
    - Distinction to explain plainly when multiple docs are pending:
      - **Index** a doc = its slips go onto the library index; we can retrieve passages by search, but no agent has read it.
      - **Load (read)** a doc = take it in; every agent has it in mind for this session. `--persist` keeps it across sessions.
    - If several documents are pending, **list them one by one** and ask: index? load? skip? Do not bulk-process silently.
    - To **index** docs: emit `[EXECUTE:/library-index]` on its own line, after user confirmation.
    - To **load** a doc: emit `[EXECUTE:/library-load:<filename>]` on its own line.
    - To **unload** a doc: emit `[EXECUTE:/library-unload:<filename>]`.
    - To **drop** from the library: emit `[EXECUTE:/library-unindex:<filename>]`.
    - On the **first message** of a session: if any `⏳`, `➕ new` or `➖ gone` items appear above, announce them and ask what to do BEFORE asking about the project.

