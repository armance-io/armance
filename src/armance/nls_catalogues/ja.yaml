# ---------------------------------------------------------------------------
# Sección docs injectada en los system prompts
# ---------------------------------------------------------------------------
docs_section:
  title: "## `.armance/docs/` 内のドキュメント（ライブラリの状態）"
  empty_title: "## `.armance/docs/` 内のドキュメント"
  empty_body: "_ドキュメントはまだありません。_ ユーザーに対し、PDF / DOCX / MD / TXT ファイルを `.armance/docs/` に置いて、**インデックス**（ライブラリに追加、セグメント検索可能）するか、**ロード**（全エージェントがテキスト全体を読み込む）するかを選択できると伝えてください。"
  empty_body_no_library: "_ドキュメントはまだありません。_ ユーザーに対し、PDF / DOCX / MD / TXT ファイルを `.armance/docs/` に置いて、どれを**ロード**（全エージェントが本セッション中にテキスト全体を読み込む）するか選択できると伝えてください。検索可能なライブラリは**この環境では設定されていません**（埋め込みモデルがありません）。そのためインデックス化は利用できません。インデックス化を提案しないでください。ユーザーから尋ねられた場合は、`armance init` を再実行して埋め込みモデルを選択することで、ライブラリを有効化できることを説明してください。"
  status_retained: "ライブラリにインデックス済み（セグメント検索可能）"
  status_unread: "⏳ 未インデックス（インデックス化またはロードを提案）"
  file_line: "- `{name}` — {status}"
  orphans_header: "### 孤立ファイル（ライブラリに残っているが、ファイルが `.armance/docs/` から削除されたもの）"
  orphan_line: "- `{name}` — `[EXECUTE:/library-unindex:{name}]` による削除を提案してください"
  changes_header: "### 前回のセッションからの変更点"
  change_added: "- ➕ 追加: `{name}` — これをアナウンスし、**インデックス**（ライブラリに追加）、**ロード**（全エージェントが読み込む）、または無視のどれを行うか尋ねてください"
  change_removed: "- ➖ 削除: `{name}` — ライブラリから削除するかどうかユーザーに尋ねてください"
  rules: |2

    ## ドキュメント処理ルール (重要)
    - ユーザー向け用語: **'ライブラリ'**（'データベース' / 'RAG' / '埋め込み' は使用しない）、**'インデックス'** または **'取り込み'**（ドキュメントを**セグメント/チャンク**としてライブラリに追加すること）、**'ロード' / '読み込み'**（テキスト全体をチームのワーキングメモリに入れること）。
    - 複数の保留ドキュメントがある場合の明確な説明分け:
      - ドキュメントを**インデックス**する = そのセグメントがライブラリのインデックスに追加されます。検索によって一節を取得できますが、エージェントは全体を読み込んでいません。
      - ドキュメントを**ロード（読み込み）**する = 全体を取り込みます。すべてのエージェントがセッション中にそれを考慮します。`--persist` でセッションをまたいで保持されます。
    - 複数のドキュメントが保留中の場合は、**1つずつリストアップ**して尋ねてください: インデックス？ロード？スキップ？裏で静かに一括処理しないでください。
    - ドキュメントを**インデックス**する場合: ユーザーの確認後、単独の行で `[EXECUTE:/library-index]` を出力します。
    - ドキュメントを**ロード**する場合: 単独の行で `[EXECUTE:/library-load:<filename>]` を出力します。
    - ドキュメントを**アンロード**する場合: `[EXECUTE:/library-unload:<filename>]` を出力します。
    - ライブラリから**インデックス削除**する場合: `[EXECUTE:/library-unindex:<filename>]` を出力します。
    - sessionの**最初のメッセージ**にて: 上記の `⏳`, `➕ 追加` または `➖ 削除` の項目が表示された場合、プロジェクトについて尋ねる前に、まずこれらを報告し、どうするか尋ねてください。

