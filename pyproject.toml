[project]
  name = "armance"
  version = "0.4.0"
  description = "Armance 👒 - a team of experts you recruit to help you decide. Coordinate a panel that debates, stress-tests and synthesises. You keep the call 💡. Not a copilot, a brain you consult when the choice matters."
  readme = "README.md"
  license = { text = "AGPL-3.0-or-later" }
  authors = [
      { name = "Guillaume Richard", email = "guillaume@richard-pro.fr" },
  ]
  keywords = [
      "llm",
      "agents",
      "decision-support",
      "multi-agent",
      "deliberation",
      "rag",
      "openrouter",
      "claude",
      "gemini",
      "cli",
      "tui",
  ]
  classifiers = [
      "Development Status :: 4 - Beta",
      "Environment :: Console",
      "Intended Audience :: End Users/Desktop",
      "Intended Audience :: Information Technology",
      "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
      "Operating System :: POSIX :: Linux",
      "Operating System :: MacOS",
      "Operating System :: Microsoft :: Windows",
      "Programming Language :: Python :: 3",
      "Programming Language :: Python :: 3.11",
      "Programming Language :: Python :: 3.12",
      "Topic :: Scientific/Engineering :: Artificial Intelligence",
      "Topic :: Software Development :: Libraries :: Python Modules",
      "Topic :: Utilities",
  ]
  requires-python = ">=3.11"
  dependencies = [
      "httpx>=0.27,<1",
      "rich>=13.0",
      "questionary>=2.0",
      "prompt-toolkit>=3.0",
      "textual>=1.0",
      "pyyaml>=6.0",
      "pydantic>=2.0",
      "python-dotenv>=1.0",
      "tiktoken>=0.7",
      "sqlite-vec>=0.1.6",
      "pypdf>=4.0",
      "python-docx>=1.1",
      "python-pptx>=0.6",
      "markdown-it-py>=3.0",
    "platformdirs>=4.0",
    "ecologits>=0.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
# PDF export needs native libs (GTK/Pango/Cairo) that pip cannot install on
# its own — notably painful on Windows. Kept optional so the base install and
# `armance web` never depend on them. DOCX/MD/PPTX export work without this.
pdf = [
    "weasyprint>=60.0",
]

  [project.urls]
  Homepage = "https://armance.io"
  Repository = "https://github.com/armance-io/armance"
  Issues = "https://github.com/armance-io/armance/issues"
  Changelog = "https://github.com/armance-io/armance/blob/main/CHANGELOG.md"

  [project.scripts]
  armance = "armance.cli:main"

  [build-system]
  requires = ["hatchling>=1.20.0"]
  build-backend = "hatchling.build"

  [tool.hatch.build.targets.sdist]
  # Keep the sdist lean: ship sources + the built UI bundle, never the
  # frontend toolchain (node_modules, out/, .next) which is huge and full of
  # symlinks that break packing.
  include = [
      "src/armance",
      "web/frontend/src",
      "web/frontend/package.json",
      "web/frontend/*.ts",
      "web/frontend/*.mjs",
      "web/frontend/*.json",
      "scripts",
      "*.md",
      "pyproject.toml",
      "uv.lock",
      "LICENSE",
  ]
  exclude = [
      "**/node_modules",
      "**/out",
      "**/.next",
      "**/__pycache__",
  ]
  artifacts = ["src/armance/web_dist/**/*", "src/armance/web_dist/*"]

  [tool.hatch.build.targets.wheel]
  packages = ["src/armance"]
  # The static frontend bundle (src/armance/web_dist/) is built by
  # `armance web --build` (or CI) and is gitignored. `artifacts` lets the
  # otherwise-ignored directory ship in the wheel when present; when absent
  # (clean checkout, no UI build) the wheel is API-only and `armance web`
  # falls back to API-only or the repo `out/` build.
  artifacts = ["src/armance/web_dist/**/*", "src/armance/web_dist/*"]
  # Backend test suite is not shipped to end users.
  exclude = ["src/armance/web/backend/tests/**"]

  [tool.uv]
  dev-dependencies = [
      "pytest>=8.0",
      "pytest-asyncio>=0.23",
      "pytest-mock>=3.12",
      "respx>=0.21",
      "pytest-cov>=5.0",
      "import-linter>=1.2",
      "mypy>=1.8",
      "ruff>=0.3",
      "types-PyYAML>=6.0",
  ]

  [tool.pytest.ini_options]
  asyncio_mode = "auto"
  testpaths = ["tests"]
  pythonpath = ["src"]

  [tool.coverage.run]
  source = ["armance"]
  omit = ["*/tests/*", "*/__pycache__/*"]

  [tool.coverage.report]
  fail_under = 75
  show_missing = true

  [tool.ruff]
  exclude = [
      ".agents",
      ".git",
      ".mypy_cache",
      ".venv",
      "__pycache__",
      "build",
      "dist",
      "node_modules",
      "wip",
      "examples",
  ]

  # [tool.mypy] strict retiré : jamais exécuté en CI et 375 erreurs au moment
  # du retrait — chantier « typing graduel » tracké côté mainteneur.
