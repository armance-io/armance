[project]
  name = "armance"
  version = "0.1.0"
  description = "Armance 👒 - a team of experts you recruit to help you decide. Coordinate a panel that debates, stress-tests and synthesises. You keep the call 💡. Not a copilot, a brain you consult when the choice matters."
  readme = "README.md"
  license = { text = "AGPL-3.0-or-later" }
  authors = [
      { name = "Guillaume Richard", email = "guillaume@richard-pro.fr" },
  ]
  keywords = [
      "llm",
      "agents",
      "decision-support",
      "multi-agent",
      "deliberation",
      "rag",
      "openrouter",
      "claude",
      "gemini",
      "cli",
      "tui",
  ]
  classifiers = [
      "Development Status :: 4 - Beta",
      "Environment :: Console",
      "Intended Audience :: End Users/Desktop",
      "Intended Audience :: Information Technology",
      "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
      "Operating System :: POSIX :: Linux",
      "Operating System :: MacOS",
      "Programming Language :: Python :: 3",
      "Programming Language :: Python :: 3.11",
      "Programming Language :: Python :: 3.12",
      "Topic :: Scientific/Engineering :: Artificial Intelligence",
      "Topic :: Software Development :: Libraries :: Python Modules",
      "Topic :: Utilities",
  ]
  requires-python = ">=3.11"
  dependencies = [
      "httpx>=0.27",
      "rich>=13.0",
      "questionary>=2.0",
      "prompt-toolkit>=3.0",
      "textual>=1.0",
      "pyyaml>=6.0",
      "pydantic>=2.0",
      "python-dotenv>=1.0",
      "tiktoken>=0.7",
      "sqlite-vec>=0.1.6",
      "pypdf>=4.0",
      "python-docx>=1.1",
      "python-pptx>=0.6",
      "markdown-it-py>=3.0",
      "weasyprint>=60.0",
      "ecologits>=0.6",
]

  [project.optional-dependencies]
  claude = [
      "claude-agent-sdk>=0.1",
  ]

  [project.urls]
  Homepage = "https://armance.io"
  Repository = "https://github.com/armance-io/armance"
  Issues = "https://github.com/armance-io/armance/issues"
  Changelog = "https://github.com/armance-io/armance/blob/main/CHANGELOG.md"

  [project.scripts]
  armance = "armance.cli:main"

  [build-system]
  requires = ["hatchling>=1.20.0"]
  build-backend = "hatchling.build"

  [tool.hatch.build.targets.wheel]
  packages = ["src/armance"]

  [tool.uv]
  dev-dependencies = [
      "pytest>=8.0",
      "pytest-asyncio>=0.23",
      "pytest-mock>=3.12",
      "respx>=0.21",
      "pytest-cov>=5.0",
      "import-linter>=1.2",
      "mypy>=1.8",
      "ruff>=0.3",
      "types-PyYAML>=6.0",
  ]

  [tool.pytest.ini_options]
  asyncio_mode = "auto"
  testpaths = ["tests"]
  pythonpath = ["src"]

  [tool.coverage.run]
  source = ["armance"]
  omit = ["*/tests/*", "*/__pycache__/*"]

  [tool.coverage.report]
  fail_under = 75
  show_missing = true

  [tool.ruff]
  exclude = [
      ".agents",
      ".git",
      ".mypy_cache",
      ".venv",
      "__pycache__",
      "build",
      "dist",
      "node_modules",
      "wip",
      "examples",
  ]

  [tool.mypy]
  strict = true
  ignore_missing_imports = true
