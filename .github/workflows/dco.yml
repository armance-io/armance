name: DCO

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Verify DCO sign-off
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check that every commit in the PR is signed off
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MISSING=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$sha" | grep -q 'Signed-off-by:'; then
              echo "::error::Commit $sha is missing 'Signed-off-by:' trailer."
              git log -1 --format='  - %h %s' "$sha"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "$MISSING commit(s) without DCO sign-off."
            echo "Fix with: git rebase --signoff main && git push --force-with-lease"
            echo "See CONTRIBUTING.md for the full DCO statement."
            exit 1
          fi
          echo "All commits signed off."
