name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

      - name: Check invariants
        run: bash scripts/check_invariants.sh

      - name: Lint (ruff)
        run: uv run ruff check src/

  test-web-backend:
    name: Web backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install web dependencies
        run: cd web && uv sync

      - name: Run web backend tests
        run: |
          if [ -d "src/armance/web/backend/tests" ]; then
            cd web && uv run pytest -q --tb=short ../src/armance/web/backend/tests/ --cov=armance.web.backend --cov-fail-under=85
          else
            echo "No web backend tests yet — skipping"
          fi

  test-web-frontend:
    name: Web frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: |
          if [ -d "web/frontend" ]; then
            cd web/frontend && pnpm install
          else
            echo "No web frontend yet — skipping"
            exit 0
          fi

      - name: Lint + build frontend
        run: |
          if [ -d "web/frontend" ]; then
            cd web/frontend && pnpm lint && pnpm build
          fi

      - name: Unit tests + coverage
        run: |
          if [ -d "web/frontend" ]; then
            cd web/frontend && pnpm test
          fi

      - name: Install Playwright browsers
        run: |
          if [ -d "web/frontend/e2e" ]; then
            cd web/frontend && pnpm exec playwright install --with-deps chromium
          fi

      - name: Playwright E2E
        run: |
          if [ -d "web/frontend/e2e" ]; then
            cd web/frontend && pnpm e2e
          else
            echo "No E2E tests yet — skipping"
          fi
